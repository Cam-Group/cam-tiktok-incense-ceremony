<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iPhone không cho trang web tự vào toàn màn hình: thêm trang vào Màn hình chính thì mở ra không có thanh trình duyệt -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Dâng hương</title>
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start; background: #1b0f0a; color: #f5e6c8; font: 15px/1.5 system-ui, sans-serif; }
  /* canvas luôn giữ tỉ lệ 9:16 và vừa khít màn hình: hẹp thì theo bề ngang, rộng thì theo chiều cao */
  canvas { flex: none; width: min(100vw, 100vh * 9 / 16); width: min(100vw, 100dvh * 9 / 16); height: auto; aspect-ratio: 9 / 16; background: #000; }
  aside { padding: 20px; width: 300px; max-width: 100%; box-sizing: border-box; }
  @media (max-width: 760px) { body { flex-direction: column; align-items: center; } aside { width: 100%; } } /* điện thoại: bảng thử nằm dưới game */
  /* có ?username=: đang chạy live, chỉ còn game ở giữa màn hình và dòng trạng thái tự ẩn */
  body.live { align-items: center; background: #000; overflow: hidden; }
  body.live aside { display: none; }
  .toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: 90vw; margin: 0; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.7); font-size: 13px; text-align: center; transition: opacity .5s; pointer-events: none; }
  .toast.tap { bottom: auto; top: 12px; color: #ffd76a; }
  h1 { font-size: 20px; margin: 0 0 12px; color: #ffd76a; }
  label { display: block; margin-bottom: 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; margin-bottom: 8px; }
  button { padding: 8px 12px; font: inherit; cursor: pointer; margin: 0 6px 6px 0; }
  .voice-controls { margin: 16px 0; }
  #voice-test { min-height: 44px; font-size: 16px; border: 1px solid #d4a017; border-radius: 6px; background: #8a1416; color: #ffd76a; touch-action: manipulation; }
  #voice-test:hover:not(:disabled) { background: #a41b1e; }
  #voice-test:focus-visible { outline: 2px solid #ffd76a; outline-offset: 3px; }
  #voice-test:disabled { cursor: default; background: #3e2820; color: #e8cfaa; border-color: #9b7940; }
  #voice { margin: 4px 0 0; color: #f5e6c8; font-size: 14px; overflow-wrap: anywhere; }
  #voice[data-state="error"], #voice[data-state="unavailable"] { color: #ffb38a; }
  body.live #voice { position: fixed; z-index: 2; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: 90vw; margin: 0; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.7); font-size: 13px; text-align: center; transition: opacity .5s; pointer-events: none; }
  body.live #voice:empty { display: none; }
</style>
</head>
<body>
<canvas id="c" width="720" height="1280" role="img" aria-label="Cảnh dâng hương trước bàn thờ Phật"></canvas>
<aside>
  <h1>Test tặng quà</h1>
  <form id="f">
    <label for="name">Tên người tặng (nhiều tên cách nhau bằng dấu phẩy)</label>
    <input id="name" autocomplete="off" maxlength="200">
    <label for="tier">Cấp</label>
    <select id="tier">
      <!-- các cấp được điền từ levels.js -->
    </select>
    <button>Tặng quà</button>
    <button type="button" id="rand">+5 ngẫu nhiên</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <p id="link" role="status"></p>
  <section id="voice-controls" class="voice-controls" aria-label="Giọng đọc">
    <button type="button" id="voice-test" aria-describedby="voice">Thử giọng đọc</button>
    <p id="voice" role="status" aria-live="polite" aria-atomic="true"></p>
  </section>
  <p>Bấm Thử giọng đọc để nghe một câu thử và kiểm tra giọng tiếng Việt trên máy.</p>
</aside>

<script src="config.js"></script>
<script src="backend-url.js"></script>
<script src="queue.js"></script>
<script src="comment-limit.js"></script>
<script src="live-events.js"></script>
<script src="levels.js"></script>
<script src="speech.js"></script>
<script src="sound.js"></script>
<script src="sound-cues.js"></script>
<script src="scenes.js"></script>
<script>
const MAX_ROWS = 4, PER_ROW = 4, WAIT_MS = 6000; // hàng thiếu người chờ tối đa WAIT_MS rồi vẫn lên
const SPEECH_RATE = 1.1;
// Mặc định dùng ảnh thật (thư mục assets/); thêm ?ve vào địa chỉ để xem bản vẽ tay.
const REAL = !new URLSearchParams(location.search).has('ve');
const W = 720, H = 1280, SPEED = 230;
const ROW_Y0 = REAL ? 1000 : 915, ROW_GAP = REAL ? 90 : 112, OFFER_Y = REAL ? 900 : 800;
const BX = REAL ? 349 : 360, RIM = REAL ? 586 : 672, RW = REAL ? 30 : 50; // lư hương: tâm, miệng lư, nửa bề rộng cắm hương
const BUD_Y = REAL ? 325 : 300;                                           // tâm tượng Phật

const WISHES = [

  'sự nghiệp hanh thông, công thành danh toại',

  'tiền bạc rủng rỉnh, của ăn của để',

const POEMS = [ // từ cấp 9: đọc một bài lục bát
  ['Hương thơm dâng trước Phật đài,', 'Cầu cho gia đạo trong ngoài bình an.', 'Lộc vàng phúc đức chứa chan,',
   'Công danh rạng rỡ, muôn vàn điều hay.', 'Quanh năm sức khoẻ tràn đầy,', 'Vạn điều như ý, tháng ngày an khang.'],
  ['Chắp tay khấn nguyện mười phương,', 'Cầu cho muôn nẻo con đường hanh thông.', 'Tiền tài như nước về sông,',
   'Tình thân ấm áp, mặn nồng trước sau.', 'Phúc dày lộc thắm bền lâu,', 'Bình an gõ cửa, sang giàu ghé thăm.'],
  ['Một nén tâm hương kính dâng,', 'Cầu cho cha mẹ muôn phần an vui.', 'Cháu con hiếu thảo trọn đời,',
   'Trong nhà đầm ấm tiếng cười quanh năm.', 'Phúc như trăng sáng đêm rằm,', 'Lộc như suối chảy âm thầm chẳng vơi.'],
  ['Đầu xuân lễ Phật cầu may,', 'Mong cho vạn sự từ nay hanh thông.', 'Làm ăn thuận buồm xuôi dòng,',
   'Tiền vào như nước, thành công rạng ngời.', 'Bạn bè quý mến khắp nơi,', 'Gia đình sum họp, cuộc đời thảnh thơi.'],
  ['Lòng thành thắp nén hương thơm,', 'Cầu cho sức khoẻ sớm hôm vững vàng.', 'Tâm an trí sáng nhẹ nhàng,',
   'Đường đời rộng mở, thênh thang lối về.', 'Bệnh tật tiêu tán mọi bề,', 'Sống vui sống khoẻ, tràn trề niềm tin.'],
  ['Khói hương bay tới cửa thiền,', 'Cầu cho đôi lứa nên duyên vợ chồng.', 'Trăm năm một dạ thuỷ chung,',
   'Sớm hôm hoà thuận, vui cùng cháu con.', 'Tình như biển rộng núi non,', 'Dẫu bao năm tháng vẫn còn đậm sâu.'],
  ['Kính dâng Tam Bảo nén hương,', 'Cầu cho con trẻ tới trường chăm ngoan.', 'Học hành thi cử vẹn toàn,',
   'Bảng vàng ghi tiếng, vinh quang rạng nhà.', 'Mai sau khôn lớn bay xa,', 'Vẫn luôn nhớ nghĩa mẹ cha sinh thành.'],
  ['Chuông chùa vang giữa sớm mai,', 'Cầu cho tai ách trong ngoài tiêu tan.', 'Đi xa về cũng bình an,',
   'Gặp điều may mắn, quý nhân phù trì.', 'Sóng to gió lớn ngại gì,', 'Tâm lành ắt có từ bi chở che.'],
  ['Hoa sen nở giữa hồ trong,', 'Cầu cho tâm tịnh, cõi lòng thảnh thơi.', 'Buông đi phiền muộn trên đời,',
   'Giữ câu nhân nghĩa, nói lời yêu thương.', 'Phúc về theo mỗi nén hương,', 'Đức dày để lại muôn phương tiếng lành.'],
  ['Năm mới thắp nén hương vàng,', 'Cầu cho phúc lộc ngập tràn quanh năm.', 'Cửa nhà rộn rã tiếng tăm,',
   'Kinh doanh phát đạt, trăm phần thuận may.', 'Của ăn của để đong đầy,', 'An khang thịnh vượng, mỗi ngày một hơn.'],
  ['Thành tâm quỳ trước Phật đài,', 'Cầu cho quốc thái, muôn loài an vui.', 'Mưa thuận gió hoà khắp nơi,',
   'Nhà nhà no ấm, người người bình an.', 'Tình thương trải khắp nhân gian,', 'Trăm điều tốt đẹp, muôn vàn phúc duyên.'],
  ['Một lòng hướng Phật sớm chiều,', 'Cầu cho ông bà thêm nhiều tuổi xuân.', 'Sống lâu trăm tuổi an nhàn,',
   'Cháu con quây quần, chứa chan nghĩa tình.', 'Tháng năm khoẻ mạnh an bình,', 'Như cây cổ thụ che mình cháu con.'],
];
const AO_DAI = ['#b3202a', '#1f5f8b', '#6a1b7a', '#0f7a5a', '#c7772a', '#c9a227', '#ece6da', '#e75480'];
const TIER_COLOR = ['#fff6d8', '#ffe9a8', '#ffd76a', '#ffc04d', '#ff9d5c', '#ff7a59', '#ff5c8a', '#e86bff', '#a78bff', '#6fc3ff', '#5ff0d0', '#ffffff']; // màu thẻ tên theo cấp
const SERIF = '"Noto Serif", Georgia, "Times New Roman", serif';

const isVip = lvl => lvl >= 7;               // từ cấp 7 được lên ngay sau lượt đang thắp
const q = makeQueue(MAX_ROWS, PER_ROW, WAIT_MS, isVip);
const board = makeBoard();                   // top người tặng nhiều kim cương nhất phiên live
const ctx = document.getElementById('c').getContext('2d');
// hàng so le nhau để thẻ tên hàng sau không đè đúng lưng hàng trước
const slotX = (j, slot) => W / 2 + (j - (PER_ROW - 1) / 2) * 150 + (slot % 2 ? 30 : -30);
let phase = '', prayT = 0, prayId = 0, speechDone = false, banner = null;
let scene = null, shake = 0, flee = false; // màn diễn đang chạy (scenes.js), độ rung màn hình, mọi người đang bỏ chạy
const colX = (j, n, slot) => slotX(j + (PER_ROW - n) / 2, slot); // hàng ít người đứng giữa (n = số người trong hàng)
let leaving = [], smoke = [], sticks = 3, glow = 0, fairy = 0;
let fx = [], ringT = 0, ringN = 0; // hạt hiệu ứng: k = 's' tàn lửa/kim sa, 'r' vòng sáng, 't' chữ bay
const TIER_RGB = ['255,246,216', '255,233,168', '255,215,106', '255,192,77', '255,157,92', '255,122,89', '255,92,138', '232,107,255', '167,139,255', '111,195,255', '95,240,208', '255,255,255'];
const BLESS = ['Phúc', 'Lộc', 'Thọ', 'An', 'Khang', 'Tài'];
const HALO = ['255,120,120', '255,200,90', '255,255,160', '140,230,170', '150,190,255'];
const rnd = (a, b) => a + Math.random() * (b - a);
const people = () => [...q.rows.flatMap(r => r.people), ...(q.offering ? q.offering.people : []), ...leaving];
const spark = (x, y, vx, vy, col, size = 2, d = 1, g = 0) => fx.push({ k: 's', x, y, vx, vy, g, life: 1, d, size, col });
const ring = (x, y, r, col) => fx.push({ k: 'r', x, y, vx: 0, vy: 0, r, life: 1, d: .7, col });
function burst(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(30, 150); spark(x, y, Math.cos(a) * v, Math.sin(a) * v - 60, col, rnd(1.5, 3.5), rnd(.8, 1.4), 120); }
}

// Điểm vào duy nhất cho quà và bình luận.
// level: 1 = bình luận, 2–12 = quà theo kim cương (levels.js). diamonds và key dùng cho bảng xếp hạng.
window.addGifter = (raw, level, diamonds = 0, key) => {
  const name = String(raw).trim().slice(0, 30);
  if (!name) return;
  if (diamonds > 0) board.add(key || name, name, diamonds);
  const accepted = q.add(name, performance.now(), Math.min(LEVELS.length, Math.max(1, Math.round(+level) || 1)));
  if (accepted) SOUND.play('gift', { gain: .8 }); // chỉ báo tiếng cho lượt được giữ lại
  return accepted;
};

// ---------- Nguồn quà thật: ?username= trên URL ----------
// Gõ username vào URL rồi tải lại trang là bắt đầu theo dõi quà của người đó trên TikTok LIVE.
// ?server=https://... trỏ tới server nhận quà khác (ví dụ server chạy trên máy bạn khi trang nằm trên Vercel).
const params = new URLSearchParams(location.search);
if (!params.has('username')) { params.set('username', ''); try { history.replaceState(null, '', '?' + params); } catch {} }
const TT_USER = (params.get('username') || '').trim().replace(/^@/, '');
const okServer = s => { try { const u = new URL(normalizeBackendURL(s)); return u.protocol === 'https:' || (u.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(u.hostname)); } catch { return false; } };
const SERVER_PARAM = params.get('server') || '';
const EVENTS_BASE = normalizeBackendURL(okServer(SERVER_PARAM) ? SERVER_PARAM : (window.APP_CONFIG?.eventsBase || ''));
const link = document.getElementById('link');
if (TT_USER) { // đang chạy live: bỏ bảng thử, trạng thái kết nối hiện thành dòng nhỏ rồi tự ẩn sau 6 giây
  document.body.classList.add('live'); document.body.append(link); link.className = 'toast';
  let hide;
  new MutationObserver(() => { link.style.opacity = 1; clearTimeout(hide); hide = setTimeout(() => { link.style.opacity = 0; }, 6000); }).observe(link, { childList: true, characterData: true, subtree: true });
  const tap = document.body.appendChild(Object.assign(document.createElement('p'), { className: 'toast tap', textContent: 'Chạm vào màn hình để vào toàn màn hình và bật giọng đọc.' }));
  // Trình duyệt chỉ cho vào toàn màn hình và giữ màn hình sáng sau một thao tác của người dùng.
  // Thoát bằng Esc hoặc vuốt; chạm lần nữa thì vào lại.
  const root = document.documentElement, goFull = root.requestFullscreen || root.webkitRequestFullscreen;
  // iPhone không có toàn màn hình cho trang web: nếu chưa mở từ Màn hình chính thì chỉ cách làm
  if (!goFull) tap.textContent = navigator.standalone ? 'Chạm vào màn hình để bật giọng đọc.' : 'Chạm vào màn hình để bật giọng đọc. Để ẩn thanh trình duyệt: Chia sẻ → Thêm vào Màn hình chính.';
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, e => {
    tap.remove();
    if (e.key === 'Escape') return;
    if (goFull && !(document.fullscreenElement || document.webkitFullscreenElement)) Promise.resolve(goFull.call(root)).catch(() => {});
    navigator.wakeLock?.request('screen').catch(() => {}); // giữ màn hình không tắt trong lúc live
  }));
}
if (location.protocol === 'file:') link.textContent = 'Mở game qua server (npm start) để nhận quà thật.';
else if (!TT_USER) link.textContent = 'Chưa có username. Thêm ?username=ten_tiktok vào URL rồi tải lại trang để bắt đầu nhận quà thật.';
else {
  const where = EVENTS_BASE || 'cùng máy chủ';
  link.textContent = `Đang kết nối @${TT_USER} qua ${where}…`;
  const es = new EventSource(`${EVENTS_BASE}/events?username=${encodeURIComponent(TT_USER)}`);
  // Luật của game nằm ở trang này, không nằm trong backend: quà tính theo kim cương, bình luận là người thắp hương cấp 1 có giới hạn
  const allowComment = createCommentLimit({ cooldownMs: 30000, gapMs: 1000 });
  const handleEvent = createLiveEventHandler({
    onGift: (name, diamonds, key) => addGifter(name, levelOfDiamonds(diamonds), diamonds, key),
    onChat: (name, key) => { if (allowComment(key)) addGifter(name, 1); },
    onStatus: text => { link.textContent = text; },
    onInvalid: () => { link.textContent = 'Đã bỏ qua một sự kiện không hợp lệ từ backend.'; },
  });
  for (const type of ['gift', 'chat', 'status']) es.addEventListener(type, e => handleEvent(type, e.data));
  es.onerror = () => { link.textContent = `Không liên lạc được server nhận quà (${where}). Kiểm tra server đã chạy chưa; trình duyệt sẽ tự thử lại.`; };
}

// ---------- Giọng đọc: mặc định bật, không có nút tắt ----------
// Trình duyệt chỉ cho đọc sau một thao tác của người dùng: chạm/bấm phím đầu tiên (hoặc sau khi trang bị gián đoạn) sẽ mở khoá.
// Live không có nút; trang thử có nút "Thử giọng đọc" để kiểm tra lại.
const voiceButton = document.getElementById('voice-test');
const voiceStatus = document.getElementById('voice');
if (TT_USER) { voiceButton.remove(); document.body.append(voiceStatus); } // live: không có nút, chỉ còn dòng trạng thái nổi
const speech = createSpeechController({
  synthesis: window.speechSynthesis, Utterance: window.SpeechSynthesisUtterance, rate: SPEECH_RATE,
  onState: ({ phase, message }) => {
    voiceStatus.textContent = message;
    voiceStatus.dataset.state = phase;
    voiceStatus.style.opacity = TT_USER && phase === 'ready' ? 0 : 1; // live: đã bật thì ẩn dòng trạng thái
    if (voiceButton.isConnected) { // trang thử: nút chỉ để kiểm tra lại
      voiceButton.disabled = phase === 'unavailable' || phase === 'testing';
      voiceButton.textContent = phase === 'testing' ? 'Đang thử giọng đọc…' : phase === 'unavailable' ? 'Không hỗ trợ giọng đọc' : 'Thử giọng đọc';
    }
  },
});
voiceButton.onclick = () => { speech.enable(); SOUND.unlock(); }; // không await trước enable: giữ thao tác trực tiếp cho iOS
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { speech.ensure(); SOUND.unlock(); })); // chạm đầu tiên mở khoá giọng đọc và âm thanh, không có nút tắt
const speak = (text, done) => speech.speak(text, done);
document.addEventListener('visibilitychange', () => { if (document.hidden) speech.reset(); });
addEventListener('pagehide', () => speech.reset());

// ---------- Cập nhật ----------
function target(p, x, y) {
  if (p.x === undefined) Object.assign(p, {
    x, y: H + 170, incense: true, seed: Math.random() * 9,
    color: AO_DAI[Math.random() * AO_DAI.length | 0], flip: Math.random() < .5, ch: Math.random() * CHARS.length | 0, kind: Math.random() * 3 | 0, // 0 nón lá, 1 khăn vấn, 2 khăn xếp
  });
  p.tx = x; p.ty = y;
}
const STRIDE = 46; // quãng đi giữa hai bước chân (px); đang chạy thì bước ngắn và nhanh hơn
const panOf = p => Math.max(-1, Math.min(1, (p.x - W / 2) / (W / 2))) * .8; // vị trí trái/phải trên màn hình
const depthGain = p => .35 + .65 * Math.min(1, Math.max(0, p.y / H));        // người ở gần màn hình thì to hơn
function step(p, dt) {
  const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), s = SPEED * (flee ? 2.6 : 1) * dt;
  p.moving = d > 0;
  const moved = Math.min(d, s);
  if (d <= s) { p.x = p.tx; p.y = p.ty; } else { p.x += dx / d * s; p.y += dy / d * s; }
  p.walk = (p.walk || 0) + moved;
  const stride = flee ? STRIDE * .7 : STRIDE;
  if (p.walk >= stride) { // mỗi bước: âm theo mặt sàn, vị trí và khoảng cách
    p.walk -= stride;
    const water = scene?.lvl === 4 && scene.s > 1.3; // cảnh 4: nước đã dâng
    SOUND.play(water ? 'step_water' : Math.random() < .5 ? 'step_church' : 'step_wood', { pan: panOf(p), gain: depthGain(p) * (flee ? 1.25 : 1) });
  }
}

// Đặt đích cho mọi người đang xếp hàng. Phải gọi lại sau finish: người từ danh sách chờ vào hàng ngay trong khung hình đó
function layoutRows() {
  const off = q.offering ? 1 : 0;
  q.rows.forEach((r, i) => r.people.forEach((p, j) => {
    target(p, colX(j, r.people.length, i + off), ROW_Y0 + (i + off) * ROW_GAP);
    if (flee) { p.tx = p.x < W / 2 ? -150 : W + 150; p.ty = H + 150; } // trần sập: mọi người chạy khỏi điện
  }));
}
function update(dt, now) {
  if (q.depart(now)) phase = 'walk';
  layoutRows();

  if (q.offering) {
    const ps = q.offering.people, tier = q.offering.tier;
    if (phase === 'walk') {
      ps.forEach((p, j) => target(p, colX(j, ps.length, 0) + 30, OFFER_Y));
      if (ps.every(p => !p.moving && p.y === OFFER_Y)) {
        phase = 'pray'; prayT = 0; speechDone = false;
        const names = ps.map(p => p.name), title = LEVELS[tier - 1].name;
        const spoken = names.length > 1 ? names.slice(0, -1).join(', ') + ' và ' + names.at(-1) : names[0];
        // cấp càng cao càng nhiều lời chúc; từ cấp 9 là một bài thơ lục bát
        const wishes = [...WISHES].sort(() => Math.random() - .5).slice(0, tier === 1 ? 1 : tier <= 4 ? 2 : 3);
        const poem = POEMS[Math.random() * POEMS.length | 0];
        const lines = tier >= 9 ? [0, 2, 4].map(i => poem[i] + ' ' + poem[i + 1][0].toLowerCase() + poem[i + 1].slice(1)) : wishes.map((w, i) => (i ? '' : 'Kính chúc ') + w);

        const text = tier >= 9
          ? `Kính mời ${spoken} lên dâng hương. Xin tặng quý vị bài thơ chúc phúc. ${lines.join(' ')}`
          : `Xin mời ${spoken} lên dâng hương. Kính chúc quý vị ${wishes.join('. ')}.`;
        const id = ++prayId;
        speak(text, () => { if (id === prayId) speechDone = true; });
        ps.forEach((p, i) => { p.bow = true; SOUND.play('bow', { pan: panOf(p), gain: depthGain(p), delay: i * .15 + Math.random() * .1 }); });
        if (tier > 1) SOUND.play('bell', { gain: .8 });
      }
    } else {
      prayT += dt;
      if (prayT > 1 && ps[0].incense) { // vừa cúi người thắp hương là màn diễn của cấp bắt đầu
        ps.forEach((p, i) => { p.incense = false; SOUND.play('incense', { pan: panOf(p), gain: depthGain(p), delay: i * .12 }); });
        sticks += ps.length;
        burst(BX, RIM - 32, 30 + tier * 6, '255,190,90');
        ring(BX, RIM, 150 + tier * 20, '255,210,120');
        scene = startScene(tier, ps);
      }
      if (scene && !scene.done && tickScene(scene, dt)) scene.done = true;
      if (scene?.done && speechDone) { // màn diễn và lời chúc đều xong: hàng này đi ra, hàng sau dồn lên
        scene = null;
        SOUND.setLayers(['amb_hall'], 2.5);
        ps.forEach(p => {
          const dir = REAL && charReady(CHARS[p.ch]) ? CHARS[p.ch].dir : p.x < W / 2 ? -1 : 1; // nhân vật ảnh động đi ra theo hướng của chính nó
          p.bow = false; p.leaving = true; p.tx = dir < 0 ? -110 : W + 110; p.ty = p.y + 70;

        layoutRows();  // người vừa vào từ danh sách chờ cần có đích trước khi bước, kẻo toạ độ thành NaN
      }
    }
  }

  if (flee && Math.random() < dt * 1.4) SOUND.play('scream', { pan: Math.random() * 1.4 - .7, gain: .5 + Math.random() * .4 }); // mọi người hét khi bỏ chạy khỏi trần sập
  people().forEach(p => {
    step(p, dt);
    if (p.moving && p.tier > 1 && Math.random() < dt * 10 * Math.min(p.tier - 1, 4)) // người tặng quà vừa/lớn đi để lại vệt kim sa
      spark(p.x + rnd(-15, 15), p.y - rnd(0, 20), rnd(-5, 5), rnd(-35, -15), TIER_RGB[p.tier - 1], rnd(1.3, 2.3), 1.2);
  });
  leaving = leaving.filter(p => p.moving);

  const ease = (v, to) => v + Math.sign(to - v) * Math.min(Math.abs(to - v), dt * .8);
  glow = ease(glow, Math.max(marks.glow, scene ? SCENES[scene.lvl].glow : 0)); fairy = ease(fairy, 0);

  smoke = smoke.filter(s => s.life > 0);

  if (Math.random() < dt * 4) spark(BX + rnd(-RW, RW), RIM - 47, rnd(-5, 5), rnd(-55, -25), '255,150,60', 1.2, .35);                         // tàn hương
  if (Math.random() < dt * 40 * glow) spark(rnd(250, 470), BUD_Y + rnd(105, 145), rnd(-5, 5), rnd(-80, -30), '255,225,130', rnd(1.5, 3), .45); // kim sa quanh tượng

}

requestAnimationFrame(function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  update(dt, now); draw(now / 1000);
  requestAnimationFrame(frame);
});

// ---------- Form test ----------
document.getElementById('tier').innerHTML = LEVELS.map((L, i) => `<option value="${i + 1}">${i + 1} — ${L.name} (${i ? 'từ ' + L.min + ' kim cương' : 'bình luận'})</option>`).join('');
if (matchMedia('(min-width: 761px)').matches) document.getElementById('name').focus(); // màn hẹp: không tự nhảy xuống ô nhập, kẻo trang cuộn khỏi game
document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('name');
  const lvl = +document.getElementById('tier').value;
  inp.value.split(',').forEach(n => addGifter(n, lvl, LEVELS[lvl - 1].min)); // quà thử: đúng ngưỡng kim cương của cấp
  inp.value = ''; inp.focus();
};
const HO = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Vũ'], TEN = ['An', 'Bình', 'Chi', 'Dũng', 'Hạnh', 'Lan', 'Minh', 'Phúc', 'Thảo', 'Tâm'];
document.getElementById('rand').onclick = () => {
  for (let i = 0; i < 5; i++) addGifter(HO[Math.random() * HO.length | 0] + ' ' + TEN[Math.random() * TEN.length | 0], 1 + Math.random() * 4 | 0);
};
</script>
</body>
